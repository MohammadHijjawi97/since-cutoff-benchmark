[project]
name = "since-cutoff-benchmark"
version = "0.1.0"
description = "Private head-to-head benchmark harness for since-cutoff (plan section B)"
requires-python = ">=3.11"
dependencies = []   # the harness uses the standard library only

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-socket==0.8.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
