reason = """
False premise for a benchmark task: the stale form never worked at the cutoff-era version, and the
replacement is not new.

1. At anthropic 0.115.0, Messages.parse() accepts `stream` but only copies it into the request body;
   the request itself is always made with stream=False. When the API answers `stream: true` with
   server-sent events, as the real API does, the SDK tries to read the event stream as one JSON
   message and fails (AttributeError: 'str' object has no attribute 'content', probe case A). So
   `parse(stream=True)` did not work before the cutoff either. Gate 4 (the stale solution passes at
   0.115.0) could only pass against a mock that ignores the stream flag and returns plain JSON
   (probe case E), and a hidden test built like that would not reflect the API.
2. `messages.stream(output_format=<pydantic type>)` already works at 0.115.0 and still works at
   1.8.0 (probe case B), so the code the task would expect is not a post-cutoff API.

What did change: 1.x removed the `stream` parameter from parse() (TypeError at 1.8.0, probe case A),
but that only removes something that was already broken.
"""
