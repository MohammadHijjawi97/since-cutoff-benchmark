stage = "premise check in the wheel sources and a runtime probe, before any task files were written"
verdict = "signature change is real, but cutoff-era code does not break: no realistic stale solution can pass gate 4 and fail gate 3"
reason = """
The signatures did change, but the change breaks no realistic 1.x code (probe.py, probe_output.txt):

1. The documented 1.x idiom is positional (`ctx.info(f"Processing {x}")` in the 1.28.1 docstrings) and
   so is sending structured data (`ctx.info({...})`, which already reached the client as `data` in 1.x).
   Both run unchanged at 2.2.0, as does `ctx.info("...", logger_name=...)`. A task built on them would
   be a no-change task: the stale solution passes at the pinned version (gate 3 fails).
2. The `**extra` that 2.x removed never worked in 1.x: info() forwarded it to log(), which has no
   **extra, so `ctx.info("...", extra={...})` or `ctx.info("...", rows=3)` raises TypeError at 1.28.1
   too (the migration guide says the same). A stale solution using it fails gate 4.
3. The only forms that pass at 1.28.1 and fail at 2.2.0 are keyword calls with the old parameter
   name: `ctx.info(message="...")` and `ctx.log(level="info", message="...")`. Nothing in the task's
   request would lead to them. Using them as the stale solution would satisfy the four gates only
   on paper: the task would measure whether the agent happens to use a keyword argument, not
   whether it knows the post-cutoff API.

Also checked, and not a replacement: in 2.2.0 log messages reach the client only on request when the
connection negotiated the 2026-07-28 protocol and the client did not opt in with Client(log_level=...)
(mcp/server/session.py:151-160, mcp/client/client.py log_level). That affects only the new `Client`
class in its default mode='auto'. A 1.x-style client (ClientSession + initialize(), the legacy
handshake) still receives every log message at 2.2.0 (probe part 2), so stale code keeps working
there too.
"""
