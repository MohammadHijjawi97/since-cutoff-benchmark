verdict = "removed from the signature, but still accepted at run time: pre-1.0 code that passes the arguments does not break"
reason = """
The arguments did leave the signature in 1.0, but huggingface_hub 1.x and 2.0.0 still accept them at run time:
`@validate_hf_hub_args` (on hf_hub_download and snapshot_download) calls smoothly_deprecate_legacy_arguments,
which pops `resume_download`, `local_dir_use_symlinks`, `force_filename` and `proxies` from kwargs and only emits
a UserWarning. The first three were already no-ops in 0.36.x (resume_download: FutureWarning "Downloads always
resume when possible"; local_dir_use_symlinks: "deprecated and will be ignored"), so there is no behaviour a
hidden test could tell apart: a stale solution behaves exactly like the reference at 2.0.0 and gate 3 (stale
fails at pinned) cannot be met. A hidden test that failed on the warning itself would test names, not
behaviour, so none was written.

`proxies` is the one legacy argument whose behaviour changed (honoured by requests in 0.x, silently ignored in
1.x/2.x), but a mocked-transport hidden test cannot observe proxy routing in both HTTP backends, and nothing in a
download request would lead to it; not pursued.

A replacement from the same 1.0 removal set that does break (list_models(direction=-1), no run-time shim) is in
bench/candidates/hf05b, validated but not admitted: it is not in the pre-registered catalogue, so admitting it
is the maintainer's decision.
"""
